<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="purple-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="30" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Network Circuit Lines -->
  <path d="M64 34 L34 86 M64 34 L94 86 M34 86 L94 86" stroke="url(#cyan-purple)" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M64 34 L64 68 M64 68 L34 86 M64 68 L94 86" stroke="url(#cyan-purple)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Central Router Node -->
  <circle cx="64" cy="68" r="6" fill="#00e5ff" filter="url(#glow)"/>

  <!-- Top API / Load Balancer Node -->
  <circle cx="64" cy="34" r="14" fill="#0f172a" stroke="url(#cyan-purple)" stroke-width="4"/>
  <circle cx="64" cy="34" r="6" fill="#00e5ff"/>

  <!-- Bottom Left DB / Storage Node -->
  <rect x="22" y="76" width="24" height="20" rx="6" fill="#0f172a" stroke="url(#cyan-purple)" stroke-width="4"/>
  <line x1="28" y1="83" x2="40" y2="83" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="89" x2="36" y2="89" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Right Compute / Microservice Node -->
  <circle cx="94" cy="86" r="14" fill="#0f172a" stroke="url(#purple-rose)" stroke-width="4"/>
  <polygon points="94,79 100,90 88,90" fill="#a855f7"/>
</svg>
